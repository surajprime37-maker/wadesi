<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaDesi - बिना नंबर सेव किए डायरेक्ट मैसेज</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e5ddd5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .whatsapp-icon-box { width: 70px; height: 70px; background-color: #25D366; border-radius: 50%; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(37,211,102,0.3); position: relative; }
        .chat-bubble { font-size: 32px; color: white; line-height: 70px; }
        .no-save-badge { position: absolute; bottom: -5px; right: -5px; background: #ff3b30; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 10px; border: 2px solid white; }
        h1 { color: #075E54; margin: 0 0 5px 0; font-size: 28px; font-weight: bold; }
        p { color: #555; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .tab-container { display: flex; justify-content: space-around; margin-bottom: 20px; background: #f0f2f5; padding: 5px; border-radius: 10px; }
        .tab { flex: 1; padding: 10px; font-size: 14px; font-weight: bold; color: #555; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab.active { background: #075E54; color: white; }
        .input-area { display: none; }
        .input-area.active { display: block; }
        input { width: 100%; padding: 15px; border: 2px solid #b9c1c7; border-radius: 12px; font-size: 16px; box-sizing: border-box; transition: 0.3s; text-align: center; font-weight: bold; background-color: #f8f9fa; margin-bottom: 15px; }
        input:focus { border-color: #075E54; outline: none; background-color: white; box-shadow: 0 0 10px rgba(7,94,84,0.15); }
        button { width: 100%; padding: 15px; background-color: #128C7E; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(18,140,126,0.25); }
        button:hover { background-color: #075E54; }
        .footer { margin-top: 25px; font-size: 11px; color: #888; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <div class="whatsapp-icon-box">
        <span class="chat-bubble">💬</span>
        <span class="no-save-badge">No Save</span>
    </div>
    
    <h1>WaDesi</h1>
    <p>बिना नंबर सेव किए चैट शुरू करें, बिजनेस मैसेज भेजें या टेलीग्राम और ग्रुप्स से जुड़ें।</p>
    
    <div class="tab-container">
        <div id="tab-wa" class="tab active" onclick="switchTab('wa')">WhatsApp</div>
        <div id="tab-tg" class="tab" onclick="switchTab('tg')">Telegram</div>
        <div id="tab-gp" class="tab" onclick="switchTab('gp')">Group Link</div>
    </div>
    
    <!-- WhatsApp / Business Section -->
    <div id="wa-section" class="input-area active">
        <input type="number" id="phone" placeholder="10 अंकों का मोबाइल नंबर लिखें" autocomplete="off">
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 15px;">
            <label style="font-size: 14px; font-weight: bold; color: #333;"><input type="radio" name="wa-type" id="wa-reg" checked> Regular</label>
            <label style="font-size: 14px; font-weight: bold; color: #333;"><input type="radio" name="wa-type" id="wa-biz"> Business</label>
        </div>
        <button onclick="goToWhatsApp()">सीधे चैट शुरू करें ➔</button>
    </div>
    
    <!-- Telegram Section -->
    <div id="tg-section" class="input-area">
        <input type="text" id="tg-username" placeholder="टेलीग्राम Username या नंबर लिखें" autocomplete="off">
        <button onclick="goToTelegram()" style="background-color: #0088cc;">टेलीग्राम पर भेजें ➔</button>
    </div>
    
    <!-- Group Section -->
    <div id="gp-section" class="input-area">
        <input type="text" id="group-url" placeholder="व्हाट्सएप ग्रुप का पूरा लिंक पेस्ट करें" autocomplete="off">
        <button onclick="joinGroup()" style="background-color: #25D366;">ग्रुप में शामिल हों ➔</button>
    </div>
    
    <div class="footer">🔒 100% सुरक्षित • आपका कोई डेटा सेव नहीं होता</div>
</div>

<script>
function switchTab(type) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.input-area').forEach(s => s.classList.remove('active'));
    
    if(type === 'wa') {
        document.getElementById('tab-wa').classList.add('active');
        document.getElementById('wa-section').classList.add('active');
    } else if(type === 'tg') {
        document.getElementById('tab-tg').classList.add('active');
        document.getElementById('tg-section').classList.add('active');
    } else if(type === 'gp') {
        document.getElementById('tab-gp').classList.add('active');
        document.getElementById('gp-section').classList.add('active');
    }
}

function goToWhatsApp() {
    var num = document.getElementById("phone").value.trim();
    var isBiz = document.getElementById("wa-biz").checked;
    if (num === "" || num.length < 10) { alert("कृपया एक सही 10 अंकों का मोबाइल नंबर डालें!"); return; }
    if (num.length === 10) { num = "91" + num; }
    
    var finalUrl = isBiz ? "https://wa.me" + num : "https://whatsapp.com" + num;
    window.open(finalUrl, "_blank");
}

function goToTelegram() {
    var user = document.getElementById("tg-username").value.trim();
    if (user === "") { alert("कृपया Username या नंबर डालें!"); return; }
    user = user.replace('@', '');
    window.open("https://t.me" + user, "_blank");
}

function joinGroup() {
    var url = document.getElementById("group-url").value.trim();
    if (url === "") { alert("कृपया ग्रुप का लिंक पेस्ट करें!"); return; }
    if (!url.includes("://whatsapp.com")) { alert("कृपया एक सही व्हाट्सएप ग्रुप लिंक डालें!"); return; }
    window.open(url, "_blank");
}
</script>

</body>
</html>
